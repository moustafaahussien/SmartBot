<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المساعد الدراسي الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
/* نفس الـ CSS بتاعك بدون تغيير */
body { font-family: 'Cairo', sans-serif; }
</style>
</head>

<body>

<textarea id="user-input"></textarea>
<button id="send-btn">إرسال</button>

<script>
const MODEL = 'claude-sonnet-4-20250514';

let state = {
  bookName: '',
  pages: [],
  totalPages: 0,
  history: [],
  ready: true
};

// ───────── PDF (مختصر) ─────────
async function processPdf(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

  state.pages = [];

  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await pdf.getPage(i);
    const cnt = await pg.getTextContent();
    const txt = cnt.items.map(x => x.str).join(' ');
    state.pages.push({ page: i, text: txt });
  }

  state.ready = true;
}

// ───────── RAG بسيط ─────────
function findRelevantPages(query) {
  const words = query.toLowerCase().split(/\s+/).filter(w => w.length > 3);

  return state.pages
    .map(p => {
      let score = 0;
      const t = p.text.toLowerCase();
      for (const w of words) if (t.includes(w)) score++;
      return { ...p, score };
    })
    .sort((a, b) => b.score - a.score)
    .slice(0, 3);
}

// ───────── SYSTEM ─────────
function buildSystem(pages) {
  let txt = '';
  for (const p of pages) {
    txt += `\n=== صفحة ${p.page} ===\n${p.text}`;
  }

  return `أجب فقط من النص التالي:
${txt}`;
}

// ───────── CHAT ─────────
const userInput = document.getElementById('user-input');
const sendBtn   = document.getElementById('send-btn');

sendBtn.onclick = send;

async function send() {
  const text = userInput.value.trim();
  if (!text || sendBtn.disabled) return;

  sendBtn.disabled = true;
  userInput.value = '';

  state.history.push({ role: 'user', content: text });

  try {
    const relevant = findRelevantPages(text);
    const pages = relevant.length ? relevant : state.pages.slice(0,2);

    await new Promise(r => setTimeout(r, 500));

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 300,
        system: buildSystem(pages),
        messages: state.history.slice(-6)
      })
    });

    if (!res.ok) throw new Error(res.status);

    const data = await res.json();
    const reply = data.content?.map(b=>b.text||'').join('') || '';

    console.log('AI:', reply);

    state.history.push({ role: 'assistant', content: reply });

    if (state.history.length > 6)
      state.history = state.history.slice(-6);

  } catch (e) {
    if (String(e).includes('429'))
      console.log('❌ Rate limit');
    else
      console.log('❌ Error');
  }

  sendBtn.disabled = false;
}
</script>

</body>
</html>
